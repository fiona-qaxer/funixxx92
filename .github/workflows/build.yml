name: Dynamic Android & Web2APK Builder

on:
  push:
    branches: [ main, build ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Read Build Configuration
        id: config
        run: |
          if [ -f "build-config.json" ]; then
            TYPE=$(jq -r '.type // "android"' build-config.json)
            BUILD_TYPE=$(jq -r '.build_type // .buildType // "release"' build-config.json)
            APP_NAME=$(jq -r '.app_name // .appName // "App"' build-config.json)
            URL=$(jq -r '.url // ""' build-config.json)
          else
            TYPE="android"
            BUILD_TYPE="release"
            APP_NAME="App"
            URL=""
          fi

          echo "type=$TYPE" >> $GITHUB_OUTPUT
          echo "build_type=$BUILD_TYPE" >> $GITHUB_OUTPUT
          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
          echo "url=$URL" >> $GITHUB_OUTPUT

      # --- LENGKAP UNTUK ANDROID GRADLE ---
      - name: Process Android Gradle Project
        if: ${{ steps.config.outputs.type == 'android' }}
        run: |
          # Ekstrak project ZIP jika dikirim dalam bentuk arsip
          if [ -f "android-project.zip" ]; then
            echo "Unzipping android-project.zip..."
            unzip -q android-project.zip -d extracted_project || true
            
            # Pindahkan isi jika terbungkus folder tunggal
            ROOT_DIR="extracted_project"
            if [ $(ls -A $ROOT_DIR | wc -l) -eq 1 ] && [ -d "$ROOT_DIR/*" ]; then
              ROOT_DIR=$(ls -d $ROOT_DIR/*)
            fi
            cp -rn $ROOT_DIR/* . || true
            rm -rf extracted_project android-project.zip
          fi

          # Cari direktori lokasi gradlew atau build.gradle
          PROJECT_DIR=$(find . -maxdepth 3 -name "build.gradle*" -exec dirname {} \; | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="."
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

          # Siapkan Gradle Wrapper jika belum ada
          cd $PROJECT_DIR
          if [ ! -f "gradlew" ]; then
            echo "gradlew tidak ditemukan, meng-generate wrapper..."
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Build Android App
        if: ${{ steps.config.outputs.type == 'android' }}
        run: |
          cd ${{ env.PROJECT_DIR }}
          BUILD_TYPE="${{ steps.config.outputs.build_type }}"
          
          if [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            ./gradlew assembleRelease --no-daemon --stacktrace
          fi

      # --- LENGKAP UNTUK WEB2APK (NATIVE/BUILT-IN TEMPLATE) ---
      - name: Process Web2APK (If requested)
        if: ${{ steps.config.outputs.type == 'web2apk' }}
        run: |
          echo "Memproses Web2APK untuk URL: ${{ steps.config.outputs.url }}"
          # Jalankan skrip pembuat Web2APK Anda di sini jika ada
          # Jika Web2APK menggunakan project gradle bawaan, Build via gradlew

      # --- PENGUMPULAN HASIL APK ---
      - name: Collect & Package Output APK
        run: |
          mkdir -p output
          
          # Cari semua file APK hasil build di seluruh subfolder
          FOUND_APKS=$(find . -type f -name "*.apk" ! -path "*/output/*")
          
          if [ -z "$FOUND_APKS" ]; then
            echo "❌ Tidak ada file APK yang ditemukan!"
            exit 1
          fi

          COUNT=1
          for apk in $FOUND_APKS; do
            echo "Ditemukan APK: $apk"
            cp "$apk" "output/app-build-$COUNT.apk"
            COUNT=$((COUNT+1))
          done

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Generated-APK
          path: output/*.apk
          retention-days: 7
